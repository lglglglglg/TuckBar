name: MenuBarOrganizer

options:
  bundleIdPrefix: com.hanshijiu
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MenuBarOrganizer:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources/TuckBarBrand.png
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanshijiu.MenuBarOrganizer
        PRODUCT_NAME: TuckBar
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "31"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO

  MenuBarOrganizerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: MenuBarOrganizer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanshijiu.MenuBarOrganizerTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/TuckBar.app/Contents/MacOS/TuckBar"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MenuBarOrganizer:
    build:
      targets:
        MenuBarOrganizer: all
        MenuBarOrganizerTests: [test]
    test:
      targets:
        - MenuBarOrganizerTests
